# ============================================================================
# Rubin IDAC Capabilities -- Brazil
# ----------------------------------------------------------------------------
# This file is the source of truth for what the public IDAC dashboard shows
# about the Brazil IDAC. Open a pull request with any change you want
# published. See data/SCHEMA.md for field definitions.
# ============================================================================

country: "Brazil"
slug: "brazil"

location:
  city:        "Rio de Janeiro"
  institution: "LIneA"
  lat: -22.953
  lng: -43.176

# === Rubin data products that will be hosted at this IDAC =================
data_products:
  object_table_subset:  true
  object_table:         false
  source_table:         false
  forced_source_table:  false
  dia_object_table:     false
  dia_source_table:     false
  solar_system_tables:  true
  co_added_images:      true
  visit_images:         false
  difference_images:    false
  template_images:      false
  other_data_products:  true

# === Rubin data releases stored at this IDAC ==============================
# List the planned data releases, e.g. ["DP1", "DR1", "DR2"]. Leave [] if TBD.
data_releases: ["DP0.1", "DP0.2", "DP1", "DP2", "DR1", "..."]

# === Capacity (integrated over the 13-year IDAC lifetime) =================
capacity:
  storage_pb_years:      65
  free_storage_pb_years: 65
  cpu_mhrs:              56
  free_cpu_mhrs:         54.8
  gpu_mhrs:              null
  free_gpu_mhrs:         null
  hosted_data_pb_years:  6.5
  expected_local_users:  170

# === Hardware architecture (FREE-TEXT, please fill in) ====================
# e.g. "AMD EPYC 9654 (Genoa), 384 cores/node" / "NVIDIA H100 80GB SXM5"
hardware:
  cpu_architecture: "AMD EPYC 9745 (Turin), 256 MB L3 cache, 128 cores/node, 4 nodes (512 cores total)"
  gpu_architecture: "Not available (future planned expansion)"
  storage_type:     "NFS over NAS (4.4 PB) + Lustre (0.6 PB), 5 PB total"
  network:          "InfiniBand EDR 100 Gbps + Ethernet 100 Gbps"
  database:         "PostgreSQL 18"

# === Software services & platform =========================================
software_services: |
  LIneA Science Platform (LSP): Jupyter notebooks, Sky Viewer (Aladin based), User Query (Daiquiri based), Target Viewer, Photo-z Server, Occultation Prediction Database.
  Under development: Image Viewer (Visiomatic based), Cluster Analysis and Visualization as a Service (CAnVAS), Value Added Catalog Creation tool, X-match service interface (based on LDSB).

# === Complementary / auxiliary datasets ===================================
complementary_datasets: |
  Survey property maps (e.g. masks; depth); photo-z tables, reference redshift catalogs and compilations, curated photo-z training sets; galaxy clusters candidates; stellar occultation events; a mirror of LSDB.io and MPC database.

# === Science use cases this IDAC specializes in ===========================
use_cases: |
  Solar system, globular clusters, galaxy clusters, unsupervised federated learning.

# === Science Collaboration agreements made ===========================
science_collaboration_agreements: ""

